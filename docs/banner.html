<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0b0d10;color:#e8edf3;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;position:relative}
  .glow{position:absolute;width:700px;height:700px;border-radius:50%;
        background:radial-gradient(circle,rgba(127,209,255,.16),transparent 65%);
        top:-260px;right:-180px}
  .glow2{position:absolute;width:560px;height:560px;border-radius:50%;
        background:radial-gradient(circle,rgba(61,220,151,.13),transparent 65%);
        bottom:-260px;left:-160px}
  .wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:15px;letter-spacing:3px;color:#7fd1ff;text-transform:uppercase}
  h1{font-size:92px;letter-spacing:-2px;line-height:1;margin-top:18px}
  .tag{font-size:24px;color:#8b97a6;margin-top:22px;line-height:1.45;max-width:840px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .chip{border:1px solid #242a33;background:#14171c;border-radius:10px;
        padding:14px 20px;font-size:19px}
  .chip b{color:#3ddc97;font-size:26px;display:block;margin-bottom:4px}
  .foot{display:flex;justify-content:space-between;align-items:center;
        font-size:18px;color:#8b97a6;border-top:1px solid #242a33;padding-top:22px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3ddc97;margin-right:9px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Squeekchain · Sepolia · public API</div>
    <h1>SQUEEKSCOPE</h1>
    <div class="tag">Live dashboard for the hamster-powered toychain.<br>
      Blocks, work, SQK supply, staking and settlements — one page.</div>
  </div>
  <div class="row">
    <div class="chip"><b>366</b>Squeek blocks</div>
    <div class="chip"><b>211.34M</b>SQK live supply</div>
    <div class="chip"><b>1.29M</b>SQK staked</div>
    <div class="chip"><b>147</b>settlements</div>
  </div>
  <div class="foot">
    <div><span class="dot"></span>SqueekScope · frostvo1d.my.id</div>
    <div>zero dependencies · read-only</div>
  </div>
</div>
</body></html>
